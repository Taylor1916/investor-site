<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Confirm email</title>
  <style>
    :root { --bg:#0f1419; --surface:#171e26; --border:#263140; --text:#e8edf2; --muted:#8b98a8; --accent:#3b82f6; --green:#34d399; --red:#f87171; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; line-height:1.5; }
    .wrap { max-width:420px; margin:16vh auto 0; padding:0 20px; }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:24px; text-align:center; }
    h2 { margin:0 0 12px; }
    .ok { color:var(--green); } .error { color:var(--red); }
    a.btn { display:inline-block; margin-top:16px; background:var(--accent); color:#fff; border-radius:8px; padding:10px 16px; text-decoration:none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" id="box"><p>Confirming your email...</p></div>
  </div>
  <script>
    const API_BASE = 'https://investor-api-1.onrender.com';
    const box = document.getElementById('box');
    const token = new URLSearchParams(window.location.search).get('token') || '';

    function show(title, text, cls) {
      box.innerHTML = '<h2 class="' + cls + '"></h2><p></p><a class="btn" href="/">Go to login</a>';
      box.querySelector('h2').textContent = title;
      box.querySelector('p').textContent = text;
    }

    (async () => {
      if (!token) return show('Invalid link', 'This confirmation link is incomplete.', 'error');
      try {
        const res = await fetch(API_BASE + '/api/verify-email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Could not confirm your email.');
        show('Email confirmed', data.message, 'ok');
      } catch (err) {
        show('Could not confirm', err.message, 'error');
      }
    })();
  </script>
</body>
</html>
